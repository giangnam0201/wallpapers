<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="poetryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/><stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#poetryGrad)"/>
  <g font-family="monospace" text-anchor="middle">
    <text x="960" y="300" font-size="14" fill="#6366f1" opacity="0.6">&lt;!-- Code is Poetry --&gt;</text>
    <text x="960" y="400" font-size="48" fill="#e2e8f0" opacity="0.9">{'{ code }' === 'art'}</text>
    <text x="960" y="500" font-size="18" fill="#a5b4fc" opacity="0.5">Every line tells a story</text>
    <text x="960" y="550" font-size="18" fill="#a5b4fc" opacity="0.4">Every function solves a problem</text>
    <text x="960" y="600" font-size="18" fill="#a5b4fc" opacity="0.3">Every commit marks progress</text>
    <text x="960" y="750" font-size="14" fill="#6366f1" opacity="0.5">// Built with passion, deployed with care</text>
  </g>
</svg>
