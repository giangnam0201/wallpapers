<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0f172a"/>
  <!-- Cloud shape -->
  <g fill="#1e293b" stroke="#334155" stroke-width="1">
    <ellipse cx="960" cy="180" rx="250" ry="80"/>
    <ellipse cx="800" cy="200" rx="150" ry="60"/>
    <ellipse cx="1120" cy="200" rx="150" ry="60"/>
  </g>
  <text x="960" y="185" font-family="monospace" font-size="16" fill="#94a3b8" text-anchor="middle">AWS / Cloud Provider</text>
  <!-- Components -->
  <g>
    <!-- Load Balancer -->
    <rect x="830" y="300" width="260" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="960" y="335" font-family="monospace" font-size="13" fill="#fbbf24" text-anchor="middle">Application Load Balancer</text>
    <!-- API Servers -->
    <rect x="400" y="430" width="200" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="500" y="465" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">API Server (x3)</text>
    <rect x="660" y="430" width="200" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="760" y="465" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">Web Server (x2)</text>
    <rect x="1060" y="430" width="200" height="60" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="1160" y="465" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">Worker (x4)</text>
    <rect x="1320" y="430" width="200" height="60" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="1420" y="465" font-family="monospace" font-size="12" fill="#c084fc" text-anchor="middle">Lambda Functions</text>
    <!-- Data layer -->
    <rect x="350" y="600" width="180" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="440" y="635" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">PostgreSQL RDS</text>
    <rect x="580" y="600" width="180" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="670" y="635" font-family="monospace" font-size="12" fill="#f87171" text-anchor="middle">Redis Cluster</text>
    <rect x="810" y="600" width="180" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="900" y="635" font-family="monospace" font-size="12" fill="#fbbf24" text-anchor="middle">S3 Bucket</text>
    <rect x="1040" y="600" width="180" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="1130" y="635" font-family="monospace" font-size="12" fill="#22d3ee" text-anchor="middle">ElasticSearch</text>
    <rect x="1270" y="600" width="180" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1360" y="635" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">SQS Queue</text>
  </g>
  <!-- Connection lines -->
  <g stroke="#475569" stroke-width="1" opacity="0.5">
    <line x1="960" y1="260" x2="960" y2="300"/>
    <line x1="960" y1="360" x2="500" y2="430"/>
    <line x1="960" y1="360" x2="760" y2="430"/>
    <line x1="960" y1="360" x2="1160" y2="430"/>
    <line x1="500" y1="490" x2="440" y2="600"/>
    <line x1="500" y1="490" x2="670" y2="600"/>
    <line x1="760" y1="490" x2="900" y2="600"/>
    <line x1="1160" y1="490" x2="1130" y2="600"/>
    <line x1="1160" y1="490" x2="1360" y2="600"/>
    <line x1="1420" y1="490" x2="1360" y2="600"/>
  </g>
  <!-- Monitoring bar -->
  <rect x="300" y="750" width="1320" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="960" y="780" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">CloudWatch | Datadog | PagerDuty | Grafana</text>
</svg>
