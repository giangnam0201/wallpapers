<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg1)"/>
  <!-- Editor window -->
  <rect x="200" y="80" width="1520" height="920" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="200" y="80" width="1520" height="40" rx="12" fill="#161b22"/>
  <rect x="200" y="108" width="1520" height="12" fill="#161b22"/>
  <circle cx="228" cy="100" r="7" fill="#ff5f56"/>
  <circle cx="252" cy="100" r="7" fill="#ffbd2e"/>
  <circle cx="276" cy="100" r="7" fill="#27c93f"/>
  <!-- Line numbers -->
  <text x="240" y="160" font-family="monospace" font-size="14" fill="#484f58">1</text>
  <text x="240" y="184" font-family="monospace" font-size="14" fill="#484f58">2</text>
  <text x="240" y="208" font-family="monospace" font-size="14" fill="#484f58">3</text>
  <text x="240" y="232" font-family="monospace" font-size="14" fill="#484f58">4</text>
  <text x="240" y="256" font-family="monospace" font-size="14" fill="#484f58">5</text>
  <text x="240" y="280" font-family="monospace" font-size="14" fill="#484f58">6</text>
  <text x="240" y="304" font-family="monospace" font-size="14" fill="#484f58">7</text>
  <text x="240" y="328" font-family="monospace" font-size="14" fill="#484f58">8</text>
  <text x="240" y="352" font-family="monospace" font-size="14" fill="#484f58">9</text>
  <text x="232" y="376" font-family="monospace" font-size="14" fill="#484f58">10</text>
  <text x="232" y="400" font-family="monospace" font-size="14" fill="#484f58">11</text>
  <text x="232" y="424" font-family="monospace" font-size="14" fill="#484f58">12</text>
  <text x="232" y="448" font-family="monospace" font-size="14" fill="#484f58">13</text>
  <text x="232" y="472" font-family="monospace" font-size="14" fill="#484f58">14</text>
  <text x="232" y="496" font-family="monospace" font-size="14" fill="#484f58">15</text>
  <text x="232" y="520" font-family="monospace" font-size="14" fill="#484f58">16</text>
  <text x="232" y="544" font-family="monospace" font-size="14" fill="#484f58">17</text>
  <text x="232" y="568" font-family="monospace" font-size="14" fill="#484f58">18</text>
  <text x="232" y="592" font-family="monospace" font-size="14" fill="#484f58">19</text>
  <text x="232" y="616" font-family="monospace" font-size="14" fill="#484f58">20</text>
  <!-- Code lines -->
  <text x="280" y="160" font-family="monospace" font-size="14" fill="#ff7b72">import</text>
  <text x="336" y="160" font-family="monospace" font-size="14" fill="#c9d1d9"> React </text>
  <text x="400" y="160" font-family="monospace" font-size="14" fill="#ff7b72">from</text>
  <text x="448" y="160" font-family="monospace" font-size="14" fill="#a5d6ff"> 'react'</text>
  <text x="280" y="184" font-family="monospace" font-size="14" fill="#ff7b72">import</text>
  <text x="336" y="184" font-family="monospace" font-size="14" fill="#c9d1d9"> { useState } </text>
  <text x="480" y="184" font-family="monospace" font-size="14" fill="#ff7b72">from</text>
  <text x="528" y="184" font-family="monospace" font-size="14" fill="#a5d6ff"> 'react'</text>
  <text x="280" y="232" font-family="monospace" font-size="14" fill="#ff7b72">const</text>
  <text x="328" y="232" font-family="monospace" font-size="14" fill="#d2a8ff"> App</text>
  <text x="360" y="232" font-family="monospace" font-size="14" fill="#c9d1d9"> = () =&gt; {</text>
  <text x="304" y="256" font-family="monospace" font-size="14" fill="#ff7b72">const</text>
  <text x="352" y="256" font-family="monospace" font-size="14" fill="#c9d1d9"> [count, setCount] = </text>
  <text x="560" y="256" font-family="monospace" font-size="14" fill="#d2a8ff">useState</text>
  <text x="632" y="256" font-family="monospace" font-size="14" fill="#c9d1d9">(</text>
  <text x="644" y="256" font-family="monospace" font-size="14" fill="#79c0ff">0</text>
  <text x="656" y="256" font-family="monospace" font-size="14" fill="#c9d1d9">)</text>
  <text x="304" y="304" font-family="monospace" font-size="14" fill="#ff7b72">return</text>
  <text x="360" y="304" font-family="monospace" font-size="14" fill="#c9d1d9"> (</text>
  <text x="328" y="328" font-family="monospace" font-size="14" fill="#7ee787">&lt;div</text>
  <text x="376" y="328" font-family="monospace" font-size="14" fill="#79c0ff"> className</text>
  <text x="460" y="328" font-family="monospace" font-size="14" fill="#c9d1d9">=</text>
  <text x="472" y="328" font-family="monospace" font-size="14" fill="#a5d6ff">"app"</text>
  <text x="512" y="328" font-family="monospace" font-size="14" fill="#7ee787">&gt;</text>
  <text x="352" y="352" font-family="monospace" font-size="14" fill="#7ee787">&lt;h1&gt;</text>
  <text x="392" y="352" font-family="monospace" font-size="14" fill="#c9d1d9">Hello World</text>
  <text x="496" y="352" font-family="monospace" font-size="14" fill="#7ee787">&lt;/h1&gt;</text>
  <text x="352" y="376" font-family="monospace" font-size="14" fill="#7ee787">&lt;p&gt;</text>
  <text x="384" y="376" font-family="monospace" font-size="14" fill="#c9d1d9">Count: {count}</text>
  <text x="504" y="376" font-family="monospace" font-size="14" fill="#7ee787">&lt;/p&gt;</text>
  <text x="352" y="400" font-family="monospace" font-size="14" fill="#7ee787">&lt;button</text>
  <text x="416" y="400" font-family="monospace" font-size="14" fill="#79c0ff"> onClick</text>
  <text x="488" y="400" font-family="monospace" font-size="14" fill="#c9d1d9">={() =&gt; setCount(count + 1)}</text>
  <text x="352" y="424" font-family="monospace" font-size="14" fill="#c9d1d9">  Increment</text>
  <text x="352" y="448" font-family="monospace" font-size="14" fill="#7ee787">&lt;/button&gt;</text>
  <text x="328" y="472" font-family="monospace" font-size="14" fill="#7ee787">&lt;/div&gt;</text>
  <text x="304" y="496" font-family="monospace" font-size="14" fill="#c9d1d9">)</text>
  <text x="280" y="520" font-family="monospace" font-size="14" fill="#c9d1d9">}</text>
  <text x="280" y="568" font-family="monospace" font-size="14" fill="#ff7b72">export default</text>
  <text x="408" y="568" font-family="monospace" font-size="14" fill="#c9d1d9"> App</text>
  <!-- Cursor blink -->
  <rect x="280" y="580" width="8" height="16" fill="#58a6ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
