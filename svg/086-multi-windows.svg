    <text x="20" y="80" font-family="monospace" font-size="12" fill="#22c55e">✓ should validate email (3ms)</text>
    <text x="20" y="100" font-family="monospace" font-size="12" fill="#ef4444">✗ should handle timeout (45ms)</text>
