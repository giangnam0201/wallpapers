    <rect width="800" height="500" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="800" height="30" rx="8" fill="#334155"/><rect y="22" width="800" height="8" fill="#334155"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/><circle cx="38" cy="15" r="5" fill="#f59e0b"/><circle cx="56" cy="15" r="5" fill="#22c55e"/>
    <text x="400" y="18" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">index.ts</text>
    <text x="20" y="60" font-family="monospace" font-size="12" fill="#c084fc">import</text><text x="65" y="60" fill="#e2e8f0"> express </text><text x="125" y="60" fill="#c084fc">from</text><text x="160" y="60" fill="#a6e3a1"> 'express'</text>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#e2e8f0">const app = express()</text>
    <text x="20" y="100" font-family="monospace" font-size="12" fill="#e2e8f0">app.listen(3000)</text>
  </g>
  <!-- Window 2 -->
  <g transform="translate(500,250)">
    <rect width="800" height="500" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="800" height="30" rx="8" fill="#334155"/><rect y="22" width="800" height="8" fill="#334155"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/><circle cx="38" cy="15" r="5" fill="#f59e0b"/><circle cx="56" cy="15" r="5" fill="#22c55e"/>
    <text x="400" y="18" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">terminal</text>
    <text x="20" y="60" font-family="monospace" font-size="12" fill="#22c55e">$ npm run dev</text>
    <text x="20" y="80" font-family="monospace" font-size="12" fill="#94a3b8">Server running on port 3000</text>
    <text x="20" y="100" font-family="monospace" font-size="12" fill="#94a3b8">Ready in 234ms</text>
  </g>
  <!-- Window 3 -->
  <g transform="translate(1000,100)">
    <rect width="800" height="500" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="800" height="30" rx="8" fill="#334155"/><rect y="22" width="800" height="8" fill="#334155"/>
    <circle cx="20" cy="15" r="5" fill="#ef4444"/><circle cx="38" cy="15" r="5" fill="#f59e0b"/><circle cx="56" cy="15" r="5" fill="#22c55e"/>
    <text x="400" y="18" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">tests.spec.ts</text>
