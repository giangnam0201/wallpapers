<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="planet" cx="45%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="70%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#6366f1;stop-opacity:0.5"/>
      <stop offset="80%" style="stop-color:#a855f7;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#030712"/>
  <!-- Stars -->
  <g fill="#fff" opacity="0.4">
    <circle cx="100" cy="100" r="1"/><circle cx="300" cy="200" r="0.8"/><circle cx="500" cy="80" r="1.2"/>
    <circle cx="700" cy="300" r="0.8"/><circle cx="1200" cy="100" r="1"/><circle cx="1500" cy="200" r="1.2"/>
    <circle cx="1700" cy="80" r="0.8"/><circle cx="1900" cy="300" r="1"/><circle cx="200" cy="900" r="1"/>
    <circle cx="600" cy="950" r="0.8"/><circle cx="1400" cy="900" r="1.2"/><circle cx="1800" cy="950" r="0.8"/>
  </g>
  <!-- Planet -->
  <circle cx="960" cy="540" r="280" fill="url(#planet)"/>
  <!-- Surface details -->
  <ellipse cx="880" cy="480" rx="60" ry="40" fill="#1f2937" opacity="0.5"/>
  <ellipse cx="1020" cy="600" rx="80" ry="50" fill="#1f2937" opacity="0.4"/>
  <ellipse cx="920" cy="650" rx="40" ry="25" fill="#1f2937" opacity="0.3"/>
  <!-- Ring -->
  <ellipse cx="960" cy="540" rx="450" ry="80" fill="none" stroke="url(#ring)" stroke-width="15" opacity="0.6" transform="rotate(-15, 960, 540)"/>
  <ellipse cx="960" cy="540" rx="420" ry="70" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.3" transform="rotate(-15, 960, 540)"/>
  <!-- Atmosphere glow -->
  <circle cx="960" cy="540" r="285" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.2"/>
</svg>
