<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="sphere" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="50%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </radialGradient>
    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#030712"/>
  <!-- Glow -->
  <circle cx="960" cy="540" r="400" fill="url(#sphereGlow)"/>
  <!-- Sphere -->
  <circle cx="960" cy="540" r="250" fill="url(#sphere)"/>
  <!-- Highlight -->
  <ellipse cx="890" cy="460" rx="60" ry="40" fill="#ffffff" opacity="0.1"/>
  <!-- Grid lines on sphere -->
  <g fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15">
    <ellipse cx="960" cy="540" rx="250" ry="50"/>
    <ellipse cx="960" cy="540" rx="250" ry="100"/>
    <ellipse cx="960" cy="540" rx="250" ry="150"/>
    <ellipse cx="960" cy="540" rx="250" ry="200"/>
    <ellipse cx="960" cy="540" rx="50" ry="250"/>
    <ellipse cx="960" cy="540" rx="100" ry="250"/>
    <ellipse cx="960" cy="540" rx="150" ry="250"/>
    <ellipse cx="960" cy="540" rx="200" ry="250"/>
  </g>
</svg>
