<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0d1117"/>
  <text x="960" y="200" font-family="monospace" font-size="20" fill="#c9d1d9" text-anchor="middle">365 contributions in the last year</text>
  <!-- Contribution grid -->
