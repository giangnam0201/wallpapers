      <rect x="0" y="48" width="18" height="18" rx="3"/><rect x="0" y="72" width="18" height="18" rx="3"/>
      <rect x="0" y="96" width="18" height="18" rx="3"/><rect x="0" y="120" width="18" height="18" rx="3"/>
      <rect x="0" y="144" width="18" height="18" rx="3"/>
    </g>
    <g fill="#006d32">
      <rect x="26" y="0" width="18" height="18" rx="3"/><rect x="26" y="48" width="18" height="18" rx="3"/>
      <rect x="26" y="96" width="18" height="18" rx="3"/><rect x="26" y="144" width="18" height="18" rx="3"/>
    </g>
    <g fill="#0e4429">
      <rect x="26" y="24" width="18" height="18" rx="3"/><rect x="26" y="72" width="18" height="18" rx="3"/>
      <rect x="26" y="120" width="18" height="18" rx="3"/>
    </g>
    <g fill="#26a641">
      <rect x="52" y="0" width="18" height="18" rx="3"/><rect x="52" y="24" width="18" height="18" rx="3"/>
      <rect x="52" y="48" width="18" height="18" rx="3"/><rect x="52" y="72" width="18" height="18" rx="3"/>
      <rect x="52" y="96" width="18" height="18" rx="3"/><rect x="52" y="120" width="18" height="18" rx="3"/>
      <rect x="52" y="144" width="18" height="18" rx="3"/>
    </g>
    <g fill="#39d353">
      <rect x="78" y="0" width="18" height="18" rx="3"/><rect x="78" y="48" width="18" height="18" rx="3"/>
      <rect x="78" y="96" width="18" height="18" rx="3"/>
    </g>
    <g fill="#006d32">
      <rect x="78" y="24" width="18" height="18" rx="3"/><rect x="78" y="72" width="18" height="18" rx="3"/>
      <rect x="78" y="120" width="18" height="18" rx="3"/><rect x="78" y="144" width="18" height="18" rx="3"/>
    </g>
