      <rect x="208" y="120" width="18" height="18" rx="3"/><rect x="234" y="24" width="18" height="18" rx="3"/>
      <rect x="260" y="72" width="18" height="18" rx="3"/><rect x="286" y="0" width="18" height="18" rx="3"/>
      <rect x="312" y="48" width="18" height="18" rx="3"/><rect x="338" y="96" width="18" height="18" rx="3"/>
    </g>
    <g fill="#39d353">
      <rect x="364" y="0" width="18" height="18" rx="3"/><rect x="364" y="24" width="18" height="18" rx="3"/>
      <rect x="364" y="48" width="18" height="18" rx="3"/><rect x="364" y="72" width="18" height="18" rx="3"/>
      <rect x="364" y="96" width="18" height="18" rx="3"/><rect x="364" y="120" width="18" height="18" rx="3"/>
      <rect x="364" y="144" width="18" height="18" rx="3"/>
      <rect x="390" y="0" width="18" height="18" rx="3"/><rect x="390" y="48" width="18" height="18" rx="3"/>
      <rect x="390" y="96" width="18" height="18" rx="3"/><rect x="390" y="144" width="18" height="18" rx="3"/>
