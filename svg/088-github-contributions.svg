      <rect x="182" y="24" width="18" height="18" rx="3"/><rect x="182" y="96" width="18" height="18" rx="3"/>
      <rect x="208" y="0" width="18" height="18" rx="3"/><rect x="208" y="72" width="18" height="18" rx="3"/>
      <rect x="234" y="48" width="18" height="18" rx="3"/><rect x="234" y="120" width="18" height="18" rx="3"/>
      <rect x="260" y="24" width="18" height="18" rx="3"/><rect x="260" y="96" width="18" height="18" rx="3"/>
