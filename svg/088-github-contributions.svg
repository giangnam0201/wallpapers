  <!-- Legend -->
  <g transform="translate(1300,500)" font-family="monospace" font-size="11" fill="#8b949e">
    <text x="0" y="12">Less</text>
    <rect x="40" y="0" width="16" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="62" y="0" width="16" height="16" rx="3" fill="#0e4429"/>
    <rect x="84" y="0" width="16" height="16" rx="3" fill="#006d32"/>
    <rect x="106" y="0" width="16" height="16" rx="3" fill="#26a641"/>
    <rect x="128" y="0" width="16" height="16" rx="3" fill="#39d353"/>
    <text x="152" y="12">More</text>
  </g>
</svg>
