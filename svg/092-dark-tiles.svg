<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="tiles" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#0a0a14"/>
      <rect x="2" y="2" width="46" height="46" rx="4" fill="#111827" stroke="#1f2937" stroke-width="0.5"/>
      <rect x="52" y="2" width="46" height="46" rx="4" fill="#111827" stroke="#1f2937" stroke-width="0.5"/>
      <rect x="2" y="52" width="46" height="46" rx="4" fill="#111827" stroke="#1f2937" stroke-width="0.5"/>
      <rect x="52" y="52" width="46" height="46" rx="4" fill="#111827" stroke="#1f2937" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#tiles)"/>
  <!-- Accent glow -->
  <radialGradient id="tileGlow" cx="50%" cy="50%" r="40%">
    <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.08"/>
    <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#tileGlow)"/>
</svg>
