<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0f0f1a"/>
  <!-- Pixel grid skull/crossbones coding mascot -->
  <g transform="translate(760,340)">
    <!-- Simple pixel art monitor -->
    <rect x="0" y="0" width="400" height="300" fill="#1a1a2e" stroke="#6366f1" stroke-width="4"/>
    <rect x="20" y="20" width="360" height="240" fill="#0a0a14"/>
    <!-- Pixel text on screen -->
    <rect x="40" y="40" width="20" height="20" fill="#4ade80"/>
    <rect x="60" y="40" width="20" height="20" fill="#4ade80"/>
    <rect x="100" y="40" width="20" height="20" fill="#f8fafc"/>
    <rect x="120" y="40" width="20" height="20" fill="#f8fafc"/>
    <rect x="140" y="40" width="20" height="20" fill="#f8fafc"/>
    <rect x="180" y="40" width="20" height="20" fill="#fbbf24"/>
    <rect x="200" y="40" width="20" height="20" fill="#fbbf24"/>
    <rect x="40" y="80" width="20" height="20" fill="#4ade80"/>
    <rect x="80" y="80" width="20" height="20" fill="#67e8f9"/>
    <rect x="100" y="80" width="20" height="20" fill="#67e8f9"/>
    <rect x="120" y="80" width="20" height="20" fill="#67e8f9"/>
    <rect x="140" y="80" width="20" height="20" fill="#67e8f9"/>
    <rect x="160" y="80" width="20" height="20" fill="#67e8f9"/>
    <rect x="40" y="120" width="20" height="20" fill="#4ade80"/>
    <rect x="80" y="120" width="20" height="20" fill="#a78bfa"/>
    <rect x="100" y="120" width="20" height="20" fill="#a78bfa"/>
    <rect x="120" y="120" width="20" height="20" fill="#f8fafc"/>
    <rect x="160" y="120" width="20" height="20" fill="#fbbf24"/>
    <rect x="180" y="120" width="20" height="20" fill="#fbbf24"/>
    <rect x="40" y="160" width="20" height="20" fill="#4ade80"/>
    <rect x="80" y="160" width="20" height="20" fill="#a78bfa"/>
    <rect x="100" y="160" width="20" height="20" fill="#a78bfa"/>
    <rect x="120" y="160" width="20" height="20" fill="#f8fafc"/>
    <rect x="160" y="160" width="20" height="20" fill="#fbbf24"/>
    <rect x="40" y="200" width="20" height="20" fill="#4ade80"/>
    <rect x="60" y="200" width="20" height="20" fill="#4ade80"/>
    <rect x="100" y="200" width="20" height="20" fill="#f8fafc"/>
    <rect x="120" y="200" width="20" height="20" fill="#f8fafc"/>
    <!-- Monitor stand -->
    <rect x="160" y="300" width="80" height="20" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
    <rect x="140" y="320" width="120" height="10" fill="#1a1a2e" stroke="#6366f1" stroke-width="2"/>
    <!-- Blinking cursor -->
    <rect x="200" y="200" width="20" height="20" fill="#4ade80" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
