<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="hzSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#030712"/>
      <stop offset="70%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="hzGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#hzSky)"/>
  <!-- Horizon glow -->
  <rect x="0" y="500" width="1920" height="200" fill="url(#hzGlow)" opacity="0.5"/>
  <!-- Horizon line -->
  <line x1="0" y1="600" x2="1920" y2="600" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
  <!-- Ground reflection lines -->
  <g stroke="#6366f1" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="650" x2="1920" y2="650"/><line x1="0" y1="710" x2="1920" y2="710"/>
    <line x1="0" y1="780" x2="1920" y2="780"/><line x1="0" y1="860" x2="1920" y2="860"/>
    <line x1="0" y1="950" x2="1920" y2="950"/><line x1="0" y1="1050" x2="1920" y2="1050"/>
  </g>
  <!-- Stars above -->
  <g fill="#fff" opacity="0.5">
    <circle cx="200" cy="100" r="1"/><circle cx="500" cy="200" r="1.2"/><circle cx="800" cy="80" r="1"/>
    <circle cx="1100" cy="150" r="1.5"/><circle cx="1400" cy="100" r="1"/><circle cx="1700" cy="200" r="1.2"/>
    <circle cx="300" cy="350" r="1"/><circle cx="900" cy="400" r="1"/><circle cx="1500" cy="380" r="1"/>
  </g>
</svg>
