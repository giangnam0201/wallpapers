<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="crosshatch" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,0 L20,20 M20,0 L0,20" stroke="#6366f1" stroke-width="0.3" opacity="0.4"/>
    </pattern>
    <radialGradient id="chGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#050510"/>
  <rect width="1920" height="1080" fill="url(#crosshatch)"/>
  <rect width="1920" height="1080" fill="url(#chGlow)"/>
</svg>
