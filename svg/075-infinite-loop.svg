<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#030712"/>
  <!-- Infinity symbol made of code -->
  <g fill="none" stroke-width="3">
    <path d="M560,540 C560,380 760,380 960,540 C1160,700 1360,700 1360,540 C1360,380 1160,380 960,540 C760,700 560,700 560,540" stroke="#6366f1" opacity="0.7"/>
    <path d="M560,540 C560,380 760,380 960,540 C1160,700 1360,700 1360,540 C1360,380 1160,380 960,540 C760,700 560,700 560,540" stroke="#818cf8" stroke-width="1.5" opacity="0.4" stroke-dasharray="10,10"/>
    <path d="M580,540 C580,400 770,400 960,540 C1150,680 1340,680 1340,540 C1340,400 1150,400 960,540 C770,680 580,680 580,540" stroke="#a5b4fc" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Code text along the path -->
  <g font-family="monospace" font-size="11" fill="#6366f1" opacity="0.5">
    <text x="620" y="440">while(true)</text>
    <text x="850" y="500">{code()}</text>
    <text x="1100" y="440">deploy()</text>
    <text x="1250" y="540">iterate()</text>
    <text x="1100" y="640">learn()</text>
    <text x="850" y="580">build()</text>
    <text x="620" y="640">repeat()</text>
  </g>
</svg>
