<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#1a1b26"/>
  <g font-family="monospace" font-size="14">
    <text x="200" y="80" fill="#565f89"># docker-compose.yml</text>
    <text x="200" y="110" fill="#7aa2f7">version:</text><text x="285" y="110" fill="#9ece6a"> '3.8'</text>
    <text x="200" y="150" fill="#7aa2f7">services:</text>
    <text x="230" y="180" fill="#e0af68">app:</text>
    <text x="260" y="210" fill="#7aa2f7">build:</text><text x="310" y="210" fill="#c0caf5"> .</text>
    <text x="260" y="240" fill="#7aa2f7">ports:</text>
    <text x="290" y="265" fill="#c0caf5">- </text><text x="310" y="265" fill="#9ece6a">"3000:3000"</text>
    <text x="260" y="295" fill="#7aa2f7">environment:</text>
    <text x="290" y="320" fill="#c0caf5">- DATABASE_URL=postgres://user:pass@db:5432/app</text>
    <text x="290" y="345" fill="#c0caf5">- REDIS_URL=redis://cache:6379</text>
    <text x="290" y="370" fill="#c0caf5">- NODE_ENV=production</text>
    <text x="260" y="400" fill="#7aa2f7">depends_on:</text>
    <text x="290" y="425" fill="#c0caf5">- db</text>
    <text x="290" y="450" fill="#c0caf5">- cache</text>
    <text x="260" y="480" fill="#7aa2f7">restart:</text><text x="320" y="480" fill="#c0caf5"> unless-stopped</text>
    <text x="230" y="530" fill="#e0af68">db:</text>
    <text x="260" y="560" fill="#7aa2f7">image:</text><text x="310" y="560" fill="#c0caf5"> postgres:16-alpine</text>
    <text x="260" y="590" fill="#7aa2f7">volumes:</text>
    <text x="290" y="615" fill="#c0caf5">- postgres_data:/var/lib/postgresql/data</text>
    <text x="260" y="645" fill="#7aa2f7">environment:</text>
    <text x="290" y="670" fill="#c0caf5">- POSTGRES_USER=user</text>
    <text x="290" y="695" fill="#c0caf5">- POSTGRES_PASSWORD=pass</text>
    <text x="290" y="720" fill="#c0caf5">- POSTGRES_DB=app</text>
    <text x="230" y="770" fill="#e0af68">cache:</text>
    <text x="260" y="800" fill="#7aa2f7">image:</text><text x="310" y="800" fill="#c0caf5"> redis:7-alpine</text>
    <text x="260" y="830" fill="#7aa2f7">command:</text><text x="320" y="830" fill="#c0caf5"> redis-server --maxmemory 256mb</text>
    <text x="200" y="890" fill="#7aa2f7">volumes:</text>
    <text x="230" y="920" fill="#e0af68">postgres_data:</text>
  </g>
</svg>
