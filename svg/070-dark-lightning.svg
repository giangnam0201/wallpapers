<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#030712"/>
  <defs>
    <filter id="lightning">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Lightning bolts -->
  <g filter="url(#lightning)">
    <polyline points="960,0 940,200 980,210 920,400 970,410 900,600 960,610 880,800 950,810 870,1080" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.8"/>
    <polyline points="960,0 940,200 980,210 920,400 970,410 900,600" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <polyline points="400,0 420,150 390,160 440,300 400,310 450,500" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
    <polyline points="1500,100 1480,250 1510,260 1460,400 1500,410 1450,550 1490,560 1440,700" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.5"/>
    <!-- Branches -->
    <polyline points="920,400 850,450 870,500" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
    <polyline points="970,410 1040,470 1020,530" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>
    <polyline points="900,600 830,650" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Ambient glow -->
  <radialGradient id="lGlow" cx="50%" cy="40%" r="40%">
    <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1"/>
    <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#lGlow)"/>
</svg>
