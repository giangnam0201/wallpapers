<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#1e1e1e"/>
  <!-- Activity bar -->
  <rect x="0" y="0" width="48" height="1080" fill="#333333"/>
  <g fill="#858585">
    <rect x="12" y="15" width="24" height="24" rx="2" opacity="0.7"/>
    <rect x="12" y="55" width="24" height="24" rx="2" opacity="0.7"/>
    <rect x="12" y="95" width="24" height="24" rx="2" opacity="0.7"/>
    <rect x="12" y="135" width="24" height="24" rx="2" opacity="0.7"/>
    <rect x="12" y="175" width="24" height="24" rx="2" opacity="0.7"/>
  </g>
  <!-- Sidebar -->
  <rect x="48" y="0" width="260" height="1080" fill="#252526"/>
  <text x="60" y="30" font-family="sans-serif" font-size="11" fill="#bbbbbb" font-weight="bold">EXPLORER</text>
  <!-- File tree -->
  <g font-family="monospace" font-size="13">
    <text x="70" y="60" fill="#cccccc">▼ src</text>
    <text x="90" y="82" fill="#cccccc">▼ components</text>
    <text x="110" y="104" fill="#519aba">Header.tsx</text>
    <text x="110" y="126" fill="#519aba">Footer.tsx</text>
    <text x="110" y="148" fill="#519aba">Sidebar.tsx</text>
    <text x="110" y="170" fill="#519aba">Button.tsx</text>
    <text x="90" y="196" fill="#cccccc">▼ hooks</text>
    <text x="110" y="218" fill="#519aba">useAuth.ts</text>
    <text x="110" y="240" fill="#519aba">useTheme.ts</text>
    <text x="90" y="266" fill="#cccccc">▼ utils</text>
    <text x="110" y="288" fill="#cbcb41">helpers.ts</text>
    <text x="110" y="310" fill="#cbcb41">constants.ts</text>
    <text x="90" y="336" fill="#519aba">App.tsx</text>
    <text x="90" y="358" fill="#519aba">index.tsx</text>
    <text x="70" y="384" fill="#cccccc">▼ public</text>
    <text x="90" y="406" fill="#e37933">index.html</text>
    <text x="70" y="432" fill="#6d8086">package.json</text>
    <text x="70" y="454" fill="#6d8086">tsconfig.json</text>
    <text x="70" y="476" fill="#6d8086">.eslintrc.js</text>
    <text x="70" y="498" fill="#41535b">README.md</text>
  </g>
  <!-- Editor area -->
  <rect x="308" y="0" width="1612" height="35" fill="#2d2d2d"/>
  <!-- Tabs -->
  <rect x="308" y="0" width="150" height="35" fill="#1e1e1e"/>
  <text x="330" y="22" font-family="monospace" font-size="12" fill="#ffffff">App.tsx</text>
  <rect x="458" y="0" width="150" height="35" fill="#2d2d2d"/>
  <text x="480" y="22" font-family="monospace" font-size="12" fill="#969696">index.tsx</text>
  <!-- Editor content -->
  <rect x="308" y="35" width="1612" height="1045" fill="#1e1e1e"/>
  <!-- Minimap -->
  <rect x="1850" y="35" width="70" height="1045" fill="#1e1e1e"/>
  <g opacity="0.3">
    <rect x="1855" y="50" width="60" height="3" fill="#569cd6"/>
    <rect x="1855" y="56" width="45" height="3" fill="#d4d4d4"/>
    <rect x="1855" y="62" width="55" height="3" fill="#d4d4d4"/>
    <rect x="1855" y="68" width="35" height="3" fill="#569cd6"/>
    <rect x="1855" y="74" width="50" height="3" fill="#ce9178"/>
    <rect x="1855" y="80" width="40" height="3" fill="#d4d4d4"/>
    <rect x="1855" y="86" width="60" height="3" fill="#4ec9b0"/>
    <rect x="1855" y="92" width="30" height="3" fill="#d4d4d4"/>
  </g>
  <!-- Status bar -->
  <rect x="0" y="1055" width="1920" height="25" fill="#007acc"/>
  <text x="15" y="1072" font-family="monospace" font-size="12" fill="#ffffff">main*</text>
  <text x="100" y="1072" font-family="monospace" font-size="12" fill="#ffffff">TypeScript React</text>
  <text x="1800" y="1072" font-family="monospace" font-size="12" fill="#ffffff">UTF-8</text>
</svg>
