<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0f172a"/>
  <!-- Spinner 1 -->
  <circle cx="300" cy="300" r="60" fill="none" stroke="#1e293b" stroke-width="8"/>
  <path d="M300,240 A60,60 0 0,1 360,300" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
  <text x="300" y="400" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">Loading...</text>
  <!-- Progress bar -->
  <rect x="550" y="280" width="400" height="12" rx="6" fill="#1e293b"/>
  <rect x="550" y="280" width="280" height="12" rx="6" fill="#6366f1"/>
  <text x="750" y="330" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">70% complete</text>
  <!-- Skeleton loader -->
  <g transform="translate(1100,220)">
    <rect width="500" height="160" rx="8" fill="#1e293b"/>
    <rect x="20" y="20" width="120" height="120" rx="60" fill="#334155"/>
    <rect x="160" y="30" width="200" height="16" rx="4" fill="#334155"/>
    <rect x="160" y="60" width="300" height="12" rx="4" fill="#334155"/>
    <rect x="160" y="85" width="250" height="12" rx="4" fill="#334155"/>
    <rect x="160" y="110" width="280" height="12" rx="4" fill="#334155"/>
  </g>
  <!-- Dots animation -->
  <g transform="translate(300,600)">
    <circle cx="0" cy="0" r="12" fill="#6366f1" opacity="0.3"/>
    <circle cx="40" cy="0" r="12" fill="#6366f1" opacity="0.6"/>
    <circle cx="80" cy="0" r="12" fill="#6366f1" opacity="1.0"/>
  </g>
  <text x="340" y="650" font-family="monospace" font-size="12" fill="#64748b">Compiling...</text>
  <!-- Pulse -->
  <circle cx="750" cy="600" r="30" fill="#6366f1" opacity="0.2"/>
  <circle cx="750" cy="600" r="20" fill="#6366f1" opacity="0.4"/>
  <circle cx="750" cy="600" r="10" fill="#6366f1" opacity="0.8"/>
  <text x="750" y="660" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">Connecting...</text>
  <!-- Download -->
  <rect x="1100" y="550" width="500" height="80" rx="8" fill="#1e293b"/>
  <rect x="1120" y="570" width="300" height="8" rx="4" fill="#334155"/>
  <rect x="1120" y="570" width="195" height="8" rx="4" fill="#22c55e"/>
  <text x="1120" y="608" font-family="monospace" font-size="11" fill="#94a3b8">Downloading packages... 127/195</text>
  <!-- Terminal build -->
  <rect x="300" y="750" width="1320" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <g font-family="monospace" font-size="12">
    <text x="330" y="785" fill="#22c55e">✓</text><text x="350" y="785" fill="#94a3b8"> Building source...</text><text x="540" y="785" fill="#64748b">done (2.3s)</text>
    <text x="330" y="810" fill="#22c55e">✓</text><text x="350" y="810" fill="#94a3b8"> Running linter...</text><text x="530" y="810" fill="#64748b">done (0.8s)</text>
    <text x="330" y="835" fill="#22c55e">✓</text><text x="350" y="835" fill="#94a3b8"> Running tests...</text><text x="520" y="835" fill="#64748b">done (4.2s)</text>
    <text x="330" y="860" fill="#f59e0b">⟳</text><text x="350" y="860" fill="#fbbf24"> Deploying to staging...</text>
    <text x="330" y="885" fill="#64748b">○ Deploy to production</text>
  </g>
</svg>
