<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#111827"/>
  <!-- Desk -->
  <rect x="200" y="800" width="1520" height="20" rx="4" fill="#1f2937"/>
  <!-- Monitor 1 -->
  <rect x="300" y="250" width="550" height="380" rx="8" fill="#030712" stroke="#374151" stroke-width="3"/>
  <rect x="520" y="630" width="110" height="100" fill="#1f2937"/>
  <rect x="450" y="730" width="250" height="15" rx="4" fill="#374151"/>
  <!-- Code on monitor 1 -->
  <g font-family="monospace" font-size="10" opacity="0.8">
    <text x="320" y="290" fill="#c084fc">function</text><text x="380" y="290" fill="#e2e8f0"> deploy() {</text>
    <text x="340" y="305" fill="#e2e8f0">const cfg = loadConfig();</text>
    <text x="340" y="320" fill="#4ade80">// Build and push</text>
    <text x="340" y="335" fill="#e2e8f0">docker.build(cfg);</text>
    <text x="340" y="350" fill="#e2e8f0">k8s.rollout(cfg);</text>
    <text x="320" y="365" fill="#e2e8f0">}</text>
  </g>
  <!-- Monitor 2 -->
  <rect x="1070" y="250" width="550" height="380" rx="8" fill="#030712" stroke="#374151" stroke-width="3"/>
  <rect x="1290" y="630" width="110" height="100" fill="#1f2937"/>
  <rect x="1220" y="730" width="250" height="15" rx="4" fill="#374151"/>
  <!-- Terminal on monitor 2 -->
  <g font-family="monospace" font-size="10" opacity="0.8">
    <text x="1090" y="290" fill="#22c55e">$ kubectl get pods</text>
    <text x="1090" y="310" fill="#94a3b8">NAME           READY   STATUS</text>
    <text x="1090" y="325" fill="#e2e8f0">api-7d4f       2/2     Running</text>
    <text x="1090" y="340" fill="#e2e8f0">web-3a2b       1/1     Running</text>
    <text x="1090" y="355" fill="#e2e8f0">worker-9c1e    1/1     Running</text>
    <text x="1090" y="380" fill="#22c55e">$ _</text>
  </g>
  <!-- Keyboard -->
  <rect x="600" y="820" width="720" height="30" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <!-- Mouse -->
  <ellipse cx="1450" cy="835" rx="30" ry="20" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <!-- Ambient light -->
  <rect x="300" y="200" width="550" height="10" fill="#6366f1" opacity="0.2"/>
  <rect x="1070" y="200" width="550" height="10" fill="#6366f1" opacity="0.2"/>
</svg>
