<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#030712"/>
  <defs>
    <filter id="smoke">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="5" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="100"/>
    </filter>
  </defs>
  <g opacity="0.4">
    <ellipse cx="600" cy="500" rx="400" ry="300" fill="#1e1b4b" filter="url(#smoke)"/>
    <ellipse cx="1300" cy="600" rx="350" ry="250" fill="#164e63" filter="url(#smoke)"/>
    <ellipse cx="960" cy="400" rx="500" ry="200" fill="#1e1b4b" opacity="0.5"/>
  </g>
  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="smokeG" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#smokeG)"/>
</svg>
