<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#1a1b26"/>
  <g font-family="monospace" font-size="15">
    <text x="250" y="100" fill="#7aa2f7">package</text><text x="330" y="100" fill="#c0caf5"> main</text>
    <text x="250" y="140" fill="#7aa2f7">import</text><text x="310" y="140" fill="#c0caf5"> (</text>
    <text x="280" y="165" fill="#9ece6a">"context"</text>
    <text x="280" y="190" fill="#9ece6a">"fmt"</text>
    <text x="280" y="215" fill="#9ece6a">"log"</text>
    <text x="280" y="240" fill="#9ece6a">"net/http"</text>
    <text x="280" y="265" fill="#9ece6a">"os/signal"</text>
    <text x="280" y="290" fill="#9ece6a">"syscall"</text>
    <text x="280" y="315" fill="#9ece6a">"time"</text>
    <text x="250" y="340" fill="#c0caf5">)</text>
    <text x="250" y="390" fill="#7aa2f7">type</text><text x="290" y="390" fill="#2ac3de"> Server</text><text x="350" y="390" fill="#7aa2f7"> struct</text><text x="400" y="390" fill="#c0caf5"> {</text>
    <text x="280" y="420" fill="#c0caf5">router *http.ServeMux</text>
    <text x="280" y="450" fill="#c0caf5">port   </text><text x="340" y="450" fill="#2ac3de">string</text>
    <text x="250" y="480" fill="#c0caf5">}</text>
    <text x="250" y="530" fill="#7aa2f7">func</text><text x="290" y="530" fill="#c0caf5"> (s *Server) </text><text x="400" y="530" fill="#e0af68">Start</text><text x="440" y="530" fill="#c0caf5">(ctx context.Context) </text><text x="620" y="530" fill="#2ac3de">error</text><text x="660" y="530" fill="#c0caf5"> {</text>
    <text x="280" y="560" fill="#c0caf5">srv := &amp;http.Server{</text>
    <text x="310" y="590" fill="#c0caf5">Addr:         </text><text x="430" y="590" fill="#9ece6a">":" + s.port</text><text x="530" y="590" fill="#c0caf5">,</text>
    <text x="310" y="620" fill="#c0caf5">Handler:      s.router,</text>
    <text x="310" y="650" fill="#c0caf5">ReadTimeout:  </text><text x="430" y="650" fill="#ff9e64">15</text><text x="450" y="650" fill="#c0caf5"> * time.Second,</text>
    <text x="310" y="680" fill="#c0caf5">WriteTimeout: </text><text x="430" y="680" fill="#ff9e64">15</text><text x="450" y="680" fill="#c0caf5"> * time.Second,</text>
    <text x="280" y="710" fill="#c0caf5">}</text>
    <text x="280" y="760" fill="#7aa2f7">go func</text><text x="335" y="760" fill="#c0caf5">() {</text>
    <text x="310" y="790" fill="#c0caf5">&lt;-ctx.Done()</text>
    <text x="310" y="820" fill="#c0caf5">shutdownCtx, cancel := context.WithTimeout(</text>
    <text x="340" y="850" fill="#c0caf5">context.Background(), </text><text x="520" y="850" fill="#ff9e64">30</text><text x="540" y="850" fill="#c0caf5">*time.Second)</text>
    <text x="310" y="880" fill="#7aa2f7">defer</text><text x="355" y="880" fill="#c0caf5"> cancel()</text>
    <text x="310" y="910" fill="#c0caf5">srv.Shutdown(shutdownCtx)</text>
    <text x="280" y="940" fill="#c0caf5">}()</text>
    <text x="280" y="980" fill="#c0caf5">log.Printf(</text><text x="370" y="980" fill="#9ece6a">"Server starting on port %s"</text><text x="600" y="980" fill="#c0caf5">, s.port)</text>
    <text x="280" y="1010" fill="#7aa2f7">return</text><text x="325" y="1010" fill="#c0caf5"> srv.ListenAndServe()</text>
    <text x="250" y="1040" fill="#c0caf5">}</text>
  </g>
</svg>
