<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0720"/>
      <stop offset="100%" style="stop-color:#1a0f3a"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="200" cy="100" r="1"/><circle cx="400" cy="60" r="1.5"/><circle cx="600" cy="120" r="1"/>
    <circle cx="800" cy="80" r="1.2"/><circle cx="1000" cy="50" r="1.5"/><circle cx="1200" cy="100" r="1"/>
    <circle cx="1400" cy="70" r="1.3"/><circle cx="1600" cy="110" r="1"/><circle cx="1800" cy="60" r="1.5"/>
    <circle cx="300" cy="200" r="1"/><circle cx="700" cy="180" r="1"/><circle cx="1100" cy="160" r="1.2"/>
    <circle cx="1500" cy="190" r="1"/><circle cx="1900" cy="150" r="1"/>
  </g>
  <!-- Mountains - back layer -->
  <polygon points="0,700 300,350 600,550 900,300 1200,500 1500,280 1800,450 1920,380 1920,1080 0,1080" fill="#1a0f3a" opacity="0.8"/>
  <!-- Mountains - mid layer -->
  <polygon points="0,800 200,500 500,650 800,400 1100,600 1400,380 1700,550 1920,450 1920,1080 0,1080" fill="#150d30" opacity="0.9"/>
  <!-- Mountains - front layer -->
  <polygon points="0,900 300,600 600,750 900,550 1200,700 1500,500 1920,700 1920,1080 0,1080" fill="#0f0720"/>
  <!-- Glow on horizon -->
  <rect x="0" y="600" width="1920" height="200" fill="#7c3aed" opacity="0.05"/>
</svg>
