<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0c0c0c"/>
  <g font-family="monospace" font-size="14">
    <text x="150" y="80" fill="#4ec9b0">#!/bin/bash</text>
    <text x="150" y="110" fill="#6a9955"># Deploy script for production</text>
    <text x="150" y="150" fill="#569cd6">set</text><text x="185" y="150" fill="#d4d4d4"> -euo pipefail</text>
    <text x="150" y="190" fill="#569cd6">readonly</text><text x="220" y="190" fill="#9cdcfe"> APP_NAME</text><text x="300" y="190" fill="#d4d4d4">=</text><text x="310" y="190" fill="#ce9178">"myapp"</text>
    <text x="150" y="220" fill="#569cd6">readonly</text><text x="220" y="220" fill="#9cdcfe"> DEPLOY_DIR</text><text x="320" y="220" fill="#d4d4d4">=</text><text x="330" y="220" fill="#ce9178">"/opt/apps/${APP_NAME}"</text>
    <text x="150" y="250" fill="#569cd6">readonly</text><text x="220" y="250" fill="#9cdcfe"> LOG_FILE</text><text x="300" y="250" fill="#d4d4d4">=</text><text x="310" y="250" fill="#ce9178">"/var/log/deploy.log"</text>
    <text x="150" y="300" fill="#dcdcaa">log()</text><text x="200" y="300" fill="#d4d4d4"> {</text>
    <text x="180" y="330" fill="#569cd6">echo</text><text x="215" y="330" fill="#ce9178"> "[$(date '+%Y-%m-%d %H:%M:%S')] $*"</text><text x="540" y="330" fill="#d4d4d4"> | tee -a </text><text x="635" y="330" fill="#9cdcfe">"$LOG_FILE"</text>
    <text x="150" y="360" fill="#d4d4d4">}</text>
    <text x="150" y="410" fill="#dcdcaa">check_deps()</text><text x="270" y="410" fill="#d4d4d4"> {</text>
    <text x="180" y="440" fill="#c586c0">for</text><text x="210" y="440" fill="#9cdcfe"> cmd</text><text x="240" y="440" fill="#c586c0"> in</text><text x="265" y="440" fill="#d4d4d4"> docker docker-compose curl jq;</text><text x="530" y="440" fill="#c586c0"> do</text>
    <text x="210" y="470" fill="#c586c0">if</text><text x="230" y="470" fill="#d4d4d4"> ! command -v </text><text x="345" y="470" fill="#9cdcfe">"$cmd"</text><text x="390" y="470" fill="#d4d4d4"> &amp;&gt; /dev/null;</text><text x="520" y="470" fill="#c586c0"> then</text>
    <text x="240" y="500" fill="#d4d4d4">log </text><text x="270" y="500" fill="#ce9178">"ERROR: $cmd not found"</text>
    <text x="240" y="530" fill="#569cd6">exit</text><text x="275" y="530" fill="#b5cea8"> 1</text>
    <text x="210" y="560" fill="#c586c0">fi</text>
    <text x="180" y="590" fill="#c586c0">done</text>
    <text x="150" y="620" fill="#d4d4d4">}</text>
    <text x="150" y="670" fill="#dcdcaa">deploy()</text><text x="230" y="670" fill="#d4d4d4"> {</text>
    <text x="180" y="700" fill="#d4d4d4">log </text><text x="210" y="700" fill="#ce9178">"Starting deployment..."</text>
    <text x="180" y="740" fill="#6a9955"># Pull latest image</text>
    <text x="180" y="770" fill="#d4d4d4">docker pull </text><text x="290" y="770" fill="#9cdcfe">"${REGISTRY}/${APP_NAME}:latest"</text>
    <text x="180" y="810" fill="#6a9955"># Run migrations</text>
    <text x="180" y="840" fill="#d4d4d4">docker compose -f docker-compose.prod.yml run --rm migrate</text>
    <text x="180" y="880" fill="#6a9955"># Rolling restart</text>
    <text x="180" y="910" fill="#d4d4d4">docker compose -f docker-compose.prod.yml up -d --no-deps --scale web=3 web</text>
    <text x="180" y="950" fill="#d4d4d4">log </text><text x="210" y="950" fill="#ce9178">"Deployment complete!"</text>
    <text x="150" y="980" fill="#d4d4d4">}</text>
    <text x="150" y="1020" fill="#d4d4d4">check_deps &amp;&amp; deploy</text>
  </g>
</svg>
