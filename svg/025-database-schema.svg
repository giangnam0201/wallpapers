<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0f172a"/>
  <!-- Users table -->
  <g transform="translate(200, 150)">
    <rect width="320" height="280" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="320" height="40" rx="8" fill="#334155"/>
    <rect y="40" width="320" height="1" fill="#334155"/>
    <text x="160" y="26" font-family="monospace" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="bold">users</text>
    <text x="20" y="70" font-family="monospace" font-size="12" fill="#fbbf24">PK</text><text x="50" y="70" font-family="monospace" font-size="12" fill="#e2e8f0">id</text><text x="250" y="70" font-family="monospace" font-size="12" fill="#64748b">uuid</text>
    <text x="50" y="95" font-family="monospace" font-size="12" fill="#e2e8f0">email</text><text x="250" y="95" font-family="monospace" font-size="12" fill="#64748b">varchar</text>
    <text x="50" y="120" font-family="monospace" font-size="12" fill="#e2e8f0">name</text><text x="250" y="120" font-family="monospace" font-size="12" fill="#64748b">varchar</text>
    <text x="50" y="145" font-family="monospace" font-size="12" fill="#e2e8f0">password_hash</text><text x="250" y="145" font-family="monospace" font-size="12" fill="#64748b">varchar</text>
    <text x="50" y="170" font-family="monospace" font-size="12" fill="#e2e8f0">role</text><text x="250" y="170" font-family="monospace" font-size="12" fill="#64748b">enum</text>
    <text x="50" y="195" font-family="monospace" font-size="12" fill="#e2e8f0">created_at</text><text x="250" y="195" font-family="monospace" font-size="12" fill="#64748b">timestamp</text>
    <text x="50" y="220" font-family="monospace" font-size="12" fill="#e2e8f0">updated_at</text><text x="250" y="220" font-family="monospace" font-size="12" fill="#64748b">timestamp</text>
  </g>
  <!-- Posts table -->
  <g transform="translate(800, 100)">
    <rect width="320" height="300" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="320" height="40" rx="8" fill="#334155"/>
    <text x="160" y="26" font-family="monospace" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="bold">posts</text>
    <text x="20" y="70" font-family="monospace" font-size="12" fill="#fbbf24">PK</text><text x="50" y="70" font-family="monospace" font-size="12" fill="#e2e8f0">id</text><text x="250" y="70" font-family="monospace" font-size="12" fill="#64748b">uuid</text>
    <text x="20" y="95" font-family="monospace" font-size="12" fill="#60a5fa">FK</text><text x="50" y="95" font-family="monospace" font-size="12" fill="#e2e8f0">user_id</text><text x="250" y="95" font-family="monospace" font-size="12" fill="#64748b">uuid</text>
    <text x="50" y="120" font-family="monospace" font-size="12" fill="#e2e8f0">title</text><text x="250" y="120" font-family="monospace" font-size="12" fill="#64748b">varchar</text>
    <text x="50" y="145" font-family="monospace" font-size="12" fill="#e2e8f0">content</text><text x="250" y="145" font-family="monospace" font-size="12" fill="#64748b">text</text>
    <text x="50" y="170" font-family="monospace" font-size="12" fill="#e2e8f0">status</text><text x="250" y="170" font-family="monospace" font-size="12" fill="#64748b">enum</text>
    <text x="50" y="195" font-family="monospace" font-size="12" fill="#e2e8f0">published_at</text><text x="250" y="195" font-family="monospace" font-size="12" fill="#64748b">timestamp</text>
    <text x="50" y="220" font-family="monospace" font-size="12" fill="#e2e8f0">created_at</text><text x="250" y="220" font-family="monospace" font-size="12" fill="#64748b">timestamp</text>
  </g>
  <!-- Comments table -->
  <g transform="translate(1400, 200)">
    <rect width="320" height="250" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect width="320" height="40" rx="8" fill="#334155"/>
    <text x="160" y="26" font-family="monospace" font-size="14" fill="#f8fafc" text-anchor="middle" font-weight="bold">comments</text>
    <text x="20" y="70" font-family="monospace" font-size="12" fill="#fbbf24">PK</text><text x="50" y="70" font-family="monospace" font-size="12" fill="#e2e8f0">id</text><text x="250" y="70" font-family="monospace" font-size="12" fill="#64748b">uuid</text>
    <text x="20" y="95" font-family="monospace" font-size="12" fill="#60a5fa">FK</text><text x="50" y="95" font-family="monospace" font-size="12" fill="#e2e8f0">post_id</text><text x="250" y="95" font-family="monospace" font-size="12" fill="#64748b">uuid</text>
    <text x="20" y="120" font-family="monospace" font-size="12" fill="#60a5fa">FK</text><text x="50" y="120" font-family="monospace" font-size="12" fill="#e2e8f0">user_id</text><text x="250" y="120" font-family="monospace" font-size="12" fill="#64748b">uuid</text>
    <text x="50" y="145" font-family="monospace" font-size="12" fill="#e2e8f0">body</text><text x="250" y="145" font-family="monospace" font-size="12" fill="#64748b">text</text>
    <text x="50" y="170" font-family="monospace" font-size="12" fill="#e2e8f0">created_at</text><text x="250" y="170" font-family="monospace" font-size="12" fill="#64748b">timestamp</text>
  </g>
  <!-- Relationship lines -->
  <g stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.6">
    <path d="M520,290 H800" marker-end="url(#arrow)"/>
    <path d="M1120,295 H1400"/>
    <path d="M520,290 Q660,600 1400,320"/>
  </g>
  <!-- Relationship labels -->
  <text x="660" y="275" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">1:N</text>
  <text x="1260" y="280" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">1:N</text>
</svg>
