<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0f172a"/>
  <!-- API Gateway -->
  <rect x="810" y="80" width="300" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="960" y="120" font-family="monospace" font-size="14" fill="#fbbf24" text-anchor="middle">API Gateway</text>
  <!-- Services -->
  <rect x="100" y="280" width="220" height="100" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="210" y="325" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">Auth Service</text>
  <text x="210" y="350" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">:3001 | Node.js</text>

  <rect x="380" y="280" width="220" height="100" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="490" y="325" font-family="monospace" font-size="12" fill="#60a5fa" text-anchor="middle">User Service</text>
  <text x="490" y="350" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">:3002 | Go</text>

  <rect x="660" y="280" width="220" height="100" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="770" y="325" font-family="monospace" font-size="12" fill="#c084fc" text-anchor="middle">Order Service</text>
  <text x="770" y="350" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">:3003 | Rust</text>

  <rect x="940" y="280" width="220" height="100" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="1050" y="325" font-family="monospace" font-size="12" fill="#22d3ee" text-anchor="middle">Payment Service</text>
  <text x="1050" y="350" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">:3004 | Java</text>

  <rect x="1220" y="280" width="220" height="100" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
  <text x="1330" y="325" font-family="monospace" font-size="12" fill="#f472b6" text-anchor="middle">Notification Svc</text>
  <text x="1330" y="350" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">:3005 | Python</text>

  <rect x="1500" y="280" width="220" height="100" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1610" y="325" font-family="monospace" font-size="12" fill="#34d399" text-anchor="middle">Search Service</text>
  <text x="1610" y="350" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">:3006 | Elixir</text>
  <!-- Message Bus -->
  <rect x="300" y="480" width="1320" height="50" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="960" y="510" font-family="monospace" font-size="13" fill="#fb923c" text-anchor="middle">Message Bus (RabbitMQ / Kafka)</text>
  <!-- Databases -->
  <rect x="100" y="620" width="180" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="190" y="660" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">PostgreSQL</text>
  <rect x="330" y="620" width="180" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="420" y="660" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">Redis</text>
  <rect x="560" y="620" width="180" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="650" y="660" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">MongoDB</text>
  <rect x="790" y="620" width="180" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="880" y="660" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle">DynamoDB</text>
  <rect x="1020" y="620" width="180" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
  <text x="1110" y="660" font-family="monospace" font-size="11" fill="#22d3ee" text-anchor="middle">Elasticsearch</text>
  <!-- Connections -->
  <g stroke="#475569" stroke-width="1" opacity="0.5">
    <line x1="960" y1="150" x2="210" y2="280"/><line x1="960" y1="150" x2="490" y2="280"/>
    <line x1="960" y1="150" x2="770" y2="280"/><line x1="960" y1="150" x2="1050" y2="280"/>
    <line x1="960" y1="150" x2="1330" y2="280"/><line x1="960" y1="150" x2="1610" y2="280"/>
    <line x1="210" y1="380" x2="210" y2="480"/><line x1="490" y1="380" x2="490" y2="480"/>
    <line x1="770" y1="380" x2="770" y2="480"/><line x1="1050" y1="380" x2="1050" y2="480"/>
    <line x1="1330" y1="380" x2="1330" y2="480"/><line x1="1610" y1="380" x2="1610" y2="480"/>
  </g>
</svg>
