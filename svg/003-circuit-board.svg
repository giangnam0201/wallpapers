    <path d="M1000,100 V300 H1200 V500 H1400 V300 H1600"/>
    <path d="M300,800 H600 V600 H900 V800 H1200"/>
    <path d="M1300,700 H1600 V900 H1800"/>
    <path d="M50,400 H200 V600 H350"/>
    <path d="M1500,200 H1700 V400 H1900"/>
