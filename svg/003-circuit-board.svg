    <circle cx="600" cy="600" r="6" opacity="0.8"/>
    <circle cx="900" cy="800" r="6" opacity="0.8"/>
  </g>
  <!-- IC chips -->
  <g>
    <rect x="380" y="350" width="80" height="50" rx="4" fill="#1a2740" stroke="#00b4d8" stroke-width="1.5"/>
    <rect x="1080" y="250" width="80" height="50" rx="4" fill="#1a2740" stroke="#00b4d8" stroke-width="1.5"/>
    <rect x="700" y="450" width="100" height="60" rx="4" fill="#1a2740" stroke="#00b4d8" stroke-width="1.5"/>
    <rect x="1400" y="600" width="80" height="50" rx="4" fill="#1a2740" stroke="#00b4d8" stroke-width="1.5"/>
