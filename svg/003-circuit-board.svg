    <circle cx="900" cy="200" r="6" opacity="0.8"/>
    <circle cx="500" cy="500" r="6" opacity="0.8"/>
    <circle cx="800" cy="700" r="6" opacity="0.8"/>
    <circle cx="1100" cy="500" r="6" opacity="0.8"/>
    <circle cx="1200" cy="300" r="6" opacity="0.8"/>
    <circle cx="1400" cy="500" r="6" opacity="0.8"/>
    <circle cx="1600" cy="300" r="6" opacity="0.8"/>
