    <circle cx="750" cy="480" r="30"/>
    <circle cx="1440" cy="625" r="25"/>
  </g>
  <!-- Secondary traces -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M100,100 H300 V300 H500"/>
    <path d="M1200,800 H1500 V600"/>
    <path d="M800,300 H1050 V150"/>
    <path d="M400,900 V750 H650"/>
