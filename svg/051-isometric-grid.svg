<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0a0a14"/>
  <g stroke="#6366f1" stroke-width="0.5" opacity="0.3" fill="none">
    <!-- Isometric lines going right -->
    <line x1="0" y1="0" x2="960" y2="540"/><line x1="0" y1="100" x2="960" y2="640"/>
    <line x1="0" y1="200" x2="960" y2="740"/><line x1="0" y1="300" x2="960" y2="840"/>
    <line x1="0" y1="400" x2="960" y2="940"/><line x1="0" y1="500" x2="960" y2="1040"/>
    <line x1="0" y1="600" x2="860" y2="1080"/><line x1="0" y1="700" x2="660" y2="1080"/>
    <line x1="0" y1="800" x2="460" y2="1080"/><line x1="0" y1="900" x2="260" y2="1080"/>
    <line x1="100" y1="0" x2="1060" y2="540"/><line x1="300" y1="0" x2="1260" y2="540"/>
    <line x1="500" y1="0" x2="1460" y2="540"/><line x1="700" y1="0" x2="1660" y2="540"/>
    <line x1="900" y1="0" x2="1860" y2="540"/><line x1="1100" y1="0" x2="1920" y2="460"/>
    <line x1="1300" y1="0" x2="1920" y2="350"/><line x1="1500" y1="0" x2="1920" y2="240"/>
    <line x1="1700" y1="0" x2="1920" y2="120"/>
    <!-- Isometric lines going left -->
    <line x1="1920" y1="0" x2="960" y2="540"/><line x1="1920" y1="100" x2="960" y2="640"/>
    <line x1="1920" y1="200" x2="960" y2="740"/><line x1="1920" y1="300" x2="960" y2="840"/>
    <line x1="1920" y1="400" x2="960" y2="940"/><line x1="1920" y1="500" x2="960" y2="1040"/>
    <line x1="1920" y1="600" x2="1060" y2="1080"/><line x1="1920" y1="700" x2="1260" y2="1080"/>
    <line x1="1920" y1="800" x2="1460" y2="1080"/><line x1="1920" y1="900" x2="1660" y2="1080"/>
    <line x1="1820" y1="0" x2="860" y2="540"/><line x1="1620" y1="0" x2="660" y2="540"/>
    <line x1="1420" y1="0" x2="460" y2="540"/><line x1="1220" y1="0" x2="260" y2="540"/>
    <line x1="1020" y1="0" x2="60" y2="540"/><line x1="820" y1="0" x2="0" y2="460"/>
    <line x1="620" y1="0" x2="0" y2="350"/><line x1="420" y1="0" x2="0" y2="240"/>
    <line x1="220" y1="0" x2="0" y2="120"/>
  </g>
  <!-- Center glow -->
  <radialGradient id="isoGlow" cx="50%" cy="50%" r="30%">
    <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
    <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#isoGlow)"/>
</svg>
