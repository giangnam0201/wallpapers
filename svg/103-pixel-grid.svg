<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="pixelGrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0a0a14"/>
      <rect x="1" y="1" width="6" height="6" fill="#0f0f1a"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#pixelGrid)"/>
  <radialGradient id="pgGlow" cx="50%" cy="50%" r="40%">
    <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.08"/>
    <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#pgGlow)"/>
</svg>
