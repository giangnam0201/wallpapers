  <!-- Highlighted hexagons -->
  <polygon points="960,440 1010,465 1010,515 960,540 910,515 910,465" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.8"/>
  <polygon points="960,440 1010,465 1010,515 960,540 910,515 910,465" fill="#7c3aed" opacity="0.1"/>
  <polygon points="860,380 910,405 910,455 860,480 810,455 810,405" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
