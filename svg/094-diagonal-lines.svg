<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="diag" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="30" x2="30" y2="0" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#050510"/>
  <rect width="1920" height="1080" fill="url(#diag)"/>
  <radialGradient id="diagGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1"/>
    <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#diagGlow)"/>
</svg>
