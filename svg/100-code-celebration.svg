<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0a0a1a"/>
  <defs>
    <linearGradient id="celebGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/><stop offset="50%" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Large 100 text -->
  <text x="960" y="500" font-family="monospace" font-size="250" fill="url(#celebGrad)" text-anchor="middle" opacity="0.15" font-weight="bold">100</text>
  <!-- Code celebration -->
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <text x="960" y="560" fill="#a5b4fc">console.log("Achievement Unlocked: 100 Wallpapers!");</text>
    <text x="960" y="600" fill="#6366f1" opacity="0.6">// commit && push && celebrate</text>
  </g>
  <!-- Confetti-like dots -->
  <g opacity="0.6">
    <circle cx="300" cy="200" r="4" fill="#6366f1"/><circle cx="500" cy="150" r="3" fill="#a855f7"/>
    <circle cx="700" cy="250" r="5" fill="#ec4899"/><circle cx="1200" cy="180" r="4" fill="#06b6d4"/>
    <circle cx="1400" cy="230" r="3" fill="#22c55e"/><circle cx="1600" cy="150" r="5" fill="#f59e0b"/>
    <circle cx="200" cy="800" r="4" fill="#f59e0b"/><circle cx="400" cy="850" r="3" fill="#22c55e"/>
    <circle cx="600" cy="900" r="5" fill="#06b6d4"/><circle cx="1300" cy="800" r="4" fill="#ec4899"/>
    <circle cx="1500" cy="900" r="3" fill="#a855f7"/><circle cx="1700" cy="850" r="5" fill="#6366f1"/>
  </g>
</svg>
