<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0a0a0a"/>
  <!-- Glitch blocks -->
  <rect x="0" y="200" width="1920" height="3" fill="#ff0040" opacity="0.8"/>
  <rect x="0" y="400" width="1920" height="2" fill="#00ffff" opacity="0.6"/>
  <rect x="0" y="600" width="1920" height="4" fill="#ff0040" opacity="0.5"/>
  <rect x="0" y="800" width="1920" height="2" fill="#00ffff" opacity="0.7"/>
  <!-- Displaced blocks -->
  <rect x="300" y="195" width="400" height="40" fill="#0a0a0a"/>
  <rect x="310" y="195" width="400" height="40" fill="none" stroke="#ff0040" stroke-width="1" opacity="0.5"/>
  <rect x="800" y="395" width="500" height="30" fill="#0a0a0a"/>
  <rect x="805" y="395" width="500" height="30" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
  <rect x="100" y="595" width="600" height="35" fill="#0a0a0a"/>
  <rect x="1200" y="795" width="400" height="25" fill="#0a0a0a"/>
  <!-- Glitched text -->
  <g font-family="monospace" font-size="72" font-weight="bold">
    <text x="960" y="540" fill="#ffffff" text-anchor="middle" opacity="0.9">SYSTEM ERROR</text>
    <text x="963" y="540" fill="#ff0040" text-anchor="middle" opacity="0.4">SYSTEM ERROR</text>
    <text x="957" y="540" fill="#00ffff" text-anchor="middle" opacity="0.4">SYSTEM ERROR</text>
    <text x="960" y="543" fill="#ff0040" text-anchor="middle" opacity="0.2">SYSTEM ERROR</text>
  </g>
  <!-- Small glitch fragments -->
  <rect x="500" y="500" width="150" height="8" fill="#ff0040" opacity="0.3"/>
  <rect x="1300" y="520" width="200" height="6" fill="#00ffff" opacity="0.3"/>
  <rect x="200" y="560" width="100" height="5" fill="#ff0040" opacity="0.4"/>
  <rect x="1500" y="480" width="180" height="7" fill="#00ffff" opacity="0.2"/>
  <!-- Noise lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="100" x2="1920" y2="100"/><line x1="0" y1="150" x2="1920" y2="150"/>
    <line x1="0" y1="250" x2="1920" y2="250"/><line x1="0" y1="350" x2="1920" y2="350"/>
    <line x1="0" y1="450" x2="1920" y2="450"/><line x1="0" y1="550" x2="1920" y2="550"/>
    <line x1="0" y1="650" x2="1920" y2="650"/><line x1="0" y1="750" x2="1920" y2="750"/>
    <line x1="0" y1="850" x2="1920" y2="850"/><line x1="0" y1="950" x2="1920" y2="950"/>
  </g>
</svg>
