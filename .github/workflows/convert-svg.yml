name: Convert SVG to PNG/JPEG

on:
  push:
    branches: [main]
    paths:
      - 'svg/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Create output directories
        run: |
          mkdir -p png/1920x1080 png/2560x1440 png/3840x2160
          mkdir -p jpeg/1920x1080 jpeg/2560x1440 jpeg/3840x2160

      - name: Convert SVG to PNG (multiple resolutions)
        run: |
          for svg in svg/*.svg; do
            filename=$(basename "$svg" .svg)
            echo "Converting $filename..."

            # 1920x1080
            rsvg-convert -w 1920 -h 1080 "$svg" -o "png/1920x1080/${filename}.png"

            # 2560x1440
            rsvg-convert -w 2560 -h 1440 "$svg" -o "png/2560x1440/${filename}.png"

            # 3840x2160 (4K)
            rsvg-convert -w 3840 -h 2160 "$svg" -o "png/3840x2160/${filename}.png"
          done

      - name: Convert PNG to JPEG
        run: |
          for png in png/1920x1080/*.png; do
            filename=$(basename "$png" .png)
            convert "$png" -quality 95 "jpeg/1920x1080/${filename}.jpg"
          done

          for png in png/2560x1440/*.png; do
            filename=$(basename "$png" .png)
            convert "$png" -quality 95 "jpeg/2560x1440/${filename}.jpg"
          done

          for png in png/3840x2160/*.png; do
            filename=$(basename "$png" .png)
            convert "$png" -quality 95 "jpeg/3840x2160/${filename}.jpg"
          done

      - name: Commit and push converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add png/ jpeg/
          git diff --staged --quiet || git commit -m "Auto-convert SVG wallpapers to PNG/JPEG"
          git push

      - name: Create release archives
        run: |
          # Count wallpapers for release tag
          COUNT=$(ls svg/*.svg | wc -l)
          echo "WALLPAPER_COUNT=$COUNT" >> $GITHUB_ENV

          # Create zip archives for release
          zip -r wallpapers-svg.zip svg/
          zip -r wallpapers-png-1080p.zip png/1920x1080/
          zip -r wallpapers-png-1440p.zip png/2560x1440/
          zip -r wallpapers-png-4k.zip png/3840x2160/
          zip -r wallpapers-jpeg-1080p.zip jpeg/1920x1080/
          zip -r wallpapers-jpeg-1440p.zip jpeg/2560x1440/
          zip -r wallpapers-jpeg-4k.zip jpeg/3840x2160/

      - name: Get current date
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Wallpapers Build #${{ github.run_number }} (${{ env.RELEASE_DATE }})"
          body: |
            ## Dark & Coding Theme Wallpapers

            **${{ env.WALLPAPER_COUNT }} wallpapers** in multiple formats and resolutions.

            ### Downloads

            | Format | Resolution | File |
            |--------|-----------|------|
            | SVG | Scalable | `wallpapers-svg.zip` |
            | PNG | 1920x1080 | `wallpapers-png-1080p.zip` |
            | PNG | 2560x1440 | `wallpapers-png-1440p.zip` |
            | PNG | 3840x2160 | `wallpapers-png-4k.zip` |
            | JPEG | 1920x1080 | `wallpapers-jpeg-1080p.zip` |
            | JPEG | 2560x1440 | `wallpapers-jpeg-1440p.zip` |
            | JPEG | 3840x2160 | `wallpapers-jpeg-4k.zip` |

            ### Themes
            Dark backgrounds, coding/dev tools, geometric patterns, space, cyberpunk, gradients, and more.

            ---
            *Auto-generated from commit ${{ github.sha }}*
          files: |
            wallpapers-svg.zip
            wallpapers-png-1080p.zip
            wallpapers-png-1440p.zip
            wallpapers-png-4k.zip
            wallpapers-jpeg-1080p.zip
            wallpapers-jpeg-1440p.zip
            wallpapers-jpeg-4k.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
